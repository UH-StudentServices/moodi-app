stages:
    - test
    - quality
    - integration test
    - release
    - deploy
    - dtrack-sbom
    - dtrack-submit

test:
    stage: test
    image: gradle:8.14.3-jdk
    script:
        - ./gradlew check test jacocoTestReport
    artifacts:
        paths:
            - build/classes/
            - build/test-results/test
            - build/reports/jacoco/test
        reports:
            coverage_report:
                coverage_format: jacoco
                path: build/reports/jacoco/test/jacocoTestReport.xml
            junit: build/test-results/test/*.xml
    rules:
        - if: $CI_PIPELINE_SOURCE == 'push' || $CI_PIPELINE_SOURCE == 'merge_request_event'

sonarqube:
    stage: quality
    dependencies:
        - test
    image: gradle:8.14.3-jdk
    variables:
        SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
        GIT_DEPTH: "0"
    cache:
        key: "${CI_JOB_NAME}"
        paths:
            - .sonar/cache
    script:
        - gradle sonar -Dsonar.token=${SONAR_TOKEN} -Dsonar.host.url=https://sonarqube.it.helsinki.fi/  -Dsonar.qualitygate.wait=true
    allow_failure: false
    rules:
        - if: $CI_COMMIT_REF_NAME == 'master' || $CI_PIPELINE_SOURCE == 'merge_request_event'

release prod:
    stage: release
    image: gradle:8.14.3-jdk
    variables:
        GIT_STRATEGY: clone
    script:
        - git config --global user.email "gitlab-ci@localhost"
        - git config --global user.name "GitLab CI"
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh
        - echo "${MOODI_APP_SSH_KEY}" > ~/.ssh/id_rsa
        - chmod 600 ~/.ssh/id_rsa
        - git config core.sshCommand "ssh -i ~/.ssh/id_rsa -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no"
        - git remote set-url origin git@${CI_SERVER_SHELL_SSH_HOST}:${CI_PROJECT_PATH}.git
        - git fetch
        - git switch master
        - ./gradlew release -Pgitlab_server=${CI_SERVER_HOST} -Pgitlab_project_id=${CI_PROJECT_ID} -Pgitlab_token=${CI_JOB_TOKEN} -Prelease.useAutomaticVersion=true
        # Make sure, that ci-deploy.properties contain new line in the end.
        - echo "" >> ci-deploy.properties
        - PACKAGE_VERSION=$(grep -i "^version=" ci-deploy.properties | cut -d'=' -f2 | tr -d '\n')
        - git checkout "${PACKAGE_VERSION}"
        - ./gradlew publish -x test -Pgitlab_server=${CI_SERVER_HOST} -Pgitlab_project_id=${CI_PROJECT_ID} -Pgitlab_token=${CI_JOB_TOKEN}
    only:
        - master
    artifacts:
        paths:
            - ci-deploy.properties
    when: manual
    needs:
        - test

publish SNAPSHOT:
    stage: release
    image: gradle:8.14.3-jdk
    variables:
        GIT_STRATEGY: clone
    script:
        - ./gradlew publish -x test -Pgitlab_server=${CI_SERVER_HOST} -Pgitlab_project_id=${CI_PROJECT_ID} -Pgitlab_token=${CI_JOB_TOKEN}
        - grep -i "^version=" gradle.properties > ci-deploy.properties
    artifacts:
        paths:
            - ci-deploy.properties
    only:
        - master
    needs:
        - test

.deploy: &deploy_template
    image: curlimages/curl
    stage: deploy
    script:
        - PACKAGE_VERSION=`grep "^version=" ci-deploy.properties | cut -d'=' -f2 | tr -d '\n'`
        - >
            curl -X POST
            -F token=$MOODI_INFRA_TRIGGER_TOKEN
            -F ref=master
            -F "variables[DEPLOY_ENV]=${ENV}"
            -F "variables[PACKAGE_VERSION]=${PACKAGE_VERSION}"
            https://${CI_SERVER_HOST}/api/v4/projects/${MOODI_INFRA_PROJECT_ID}/trigger/pipeline

deploy prod:
    <<: *deploy_template
    variables:
        ENV: prod
    only:
        - master
    needs:
        - release prod

deploy dev:
    <<: *deploy_template
    image: curlimages/curl
    variables:
        ENV: dev
    only:
        - master
    needs:
        - publish SNAPSHOT

.integration test: &integration_test_template
    image: gradle:8.14.3-jdk
    stage: integration test
    script:
        - >
            ./gradlew itest --rerun-tasks
            -Pmoodle_base_url=${MOODLE_URL}/webservice/rest/server.php
            -Pmoodle_ws_token=${MOODLE_WS_TOKEN}

integration test current:
    <<: *integration_test_template
    variables:
        MOODLE_URL: ${MOODLE_URL_DEV_CURRENT}
        MOODLE_WS_TOKEN: ${MOODLE_WS_TOKEN_DEV}
    needs:
        - test
    when: manual
    artifacts:
        reports:
            junit: build/test-results/itest/*.xml

integration test next:
    <<: *integration_test_template
    variables:
        MOODLE_URL: ${MOODLE_URL_DEV_NEXT}
        MOODLE_WS_TOKEN: ${MOODLE_WS_TOKEN_DEV}
    needs:
        - test
    when: manual
    artifacts:
        reports:
            junit: build/test-results/itest/*.xml

dtrack-sbom:
    stage: dtrack-sbom
    image: gradle:8.14.3-jdk
    script:
        - ./gradlew cyclonedxBom
    only:
        - master
    needs:
        - deploy prod
    artifacts:
        expire_in: 1h
        paths:
            - build/reports/application.cdx.json

submit-sbom:
    stage: dtrack-submit
    image: alpine:latest
    dependencies:
        - dtrack-sbom
    only:
        - master
    needs:
        - dtrack-sbom
    before_script:
        - apk add --no-cache curl
    script:
        - "curl -X POST ${DTRACK_API_URL}/v1/bom -H 'Content-Type: multipart/form-data' -H 'X-Api-Key: '${DTRACK_API_KEY} -F 'projectName='${PROJECT_NAME} -F 'autoCreate=true' -F 'bom=@build/reports/application.cdx.json'"
